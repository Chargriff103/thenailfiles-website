<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Nail Files</title>
<meta name="description" content="Coming soon.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Instrument+Serif:ital@1&family=Karla:wght@400;500;700&display=swap');

:root{
  --ink:#2E4A2C;
  --field:#3D5C3A;
  --cream:#F2D9C4;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--field);
  color:var(--cream);
  font-family:'Karla',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
}

.card{
  width:100%;
  max-width:420px;
  text-align:center;
}

.mark{margin:0 auto 40px;width:96px;}
.mark svg{overflow:visible;width:100%;height:auto;}

.eyebrow{
  font-family:'Karla',sans-serif;font-weight:500;font-size:11px;
  text-transform:uppercase;letter-spacing:.42em;color:var(--cream);
  opacity:.75;
  margin-bottom:8px;
}

.nail-line{
  font-family:'Bodoni Moda',serif;font-weight:700;font-size:44px;
  text-transform:uppercase;letter-spacing:.16em;line-height:.9;
  text-indent:.16em;color:var(--cream);margin:0;
}

.files-row{
  display:flex;align-items:center;gap:14px;margin:8px 0 36px;
}
.files-row .rule{flex:1;height:1px;background:var(--cream);opacity:.6;}
.files-row .files-word{
  font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;
  font-size:42px;line-height:.9;color:var(--cream);white-space:nowrap;
}

.status{
  display:inline-flex;align-items:center;gap:9px;
  border:1px solid var(--cream);
  padding:10px 20px;
  font-family:'Karla',sans-serif;font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:.16em;color:var(--cream);
  margin-bottom:36px;
}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--cream);}

.contact{
  font-family:'Karla',sans-serif;font-weight:400;font-size:14px;
  color:var(--cream);opacity:.85;
}
.contact a{
  color:var(--cream);
  text-decoration:none;
  border-bottom:1px solid var(--cream);
  text-underline-offset:3px;
}
.contact a:hover{opacity:1;}
</style>
</head>
<body>

<div class="card">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 160 124">
      <defs>
        <path id="nail" fill="#F2D9C4" d="M0 12.35 A6.5 12.35 0 0 1 6.5 0 A6.5 12.35 0 0 1 13 12.35 A5.46 6.65 0 0 1 7.54 19 L5.46 19 A5.46 6.65 0 0 1 0 12.35 Z"></path>
      </defs>
      <path d="M2.5 26.5 H100 L112 2.5 H157.5 V121.5 H2.5 Z" fill="none" stroke="#F2D9C4" stroke-width="5" stroke-linejoin="round"></path>
      <g>
        <use href="#nail" x="133.5" y="5.5"></use>
        <use href="#nail" x="13.5" y="35.5"></use><use href="#nail" x="43.5" y="35.5"></use><use href="#nail" x="73.5" y="35.5"></use><use href="#nail" x="103.5" y="35.5"></use><use href="#nail" x="133.5" y="35.5"></use>
        <use href="#nail" x="13.5" y="65.5"></use><use href="#nail" x="43.5" y="65.5"></use><use href="#nail" x="73.5" y="65.5"></use><use href="#nail" x="103.5" y="65.5"></use><use href="#nail" x="133.5" y="65.5"></use>
        <use href="#nail" x="13.5" y="95.5"></use><use href="#nail" x="43.5" y="95.5"></use><use href="#nail" x="73.5" y="95.5"></use><use href="#nail" x="103.5" y="95.5"></use><use href="#nail" x="133.5" y="95.5"></use>
      </g>
    </svg>
  </div>

  <div class="eyebrow">The</div>
  <h1 class="nail-line">Nail</h1>
  <div class="files-row"><span class="rule"></span><span class="files-word">Files</span><span class="rule"></span></div>

  <div class="status"><span class="dot"></span>Coming soon</div>

  <p class="contact"><a href="mailto:hello@thenailfiles.co.uk">hello@thenailfiles.co.uk</a></p>
  <p class="contact"><a href="/privacy/">Privacy Notice</a></p>
</div>

</body>
</html>
